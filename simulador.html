<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SimLab · Laboratorio de Convertidores Eléctricos</title>
<style>
:root {
  --bg: #0d1117;
  --surface: #161b22;
  --surface2: #21262d;
  --border: #30363d;
  --text: #e6edf3;
  --muted: #8b949e;
  --green: #3fb950;
  --green-dim: #122a1a;
  --amber: #d29922;
  --amber-dim: #2a1f00;
  --red: #f85149;
  --red-dim: #2a0a09;
  --blue: #58a6ff;
  --blue-dim: #0c1e40;
  --wire: #3fb950;
  --wire-live: #ff9f43;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh}

/* ── LANDING ── */
#landing{max-width:980px;margin:0 auto;padding:2rem 1.25rem}
.hdr{text-align:center;margin-bottom:2.5rem;padding-top:1rem}
.hdr h1{font-size:2rem;font-weight:700;background:linear-gradient(135deg,var(--blue),var(--green));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hdr p{color:var(--muted);margin-top:.4rem;font-size:.95rem}
.hdr small{display:block;margin-top:.25rem;color:var(--muted);font-size:.8rem}

.progress-row{display:flex;align-items:center;gap:1rem;margin-bottom:1.5rem;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:.85rem 1.25rem}
.progress-row span{font-size:.85rem;color:var(--muted);white-space:nowrap}
.pbar{flex:1;height:6px;background:var(--surface2);border-radius:3px;overflow:hidden}
.pfill{height:100%;background:linear-gradient(90deg,var(--blue),var(--green));border-radius:3px;transition:width .5s ease}
.pscore{font-size:.9rem;font-weight:600;color:var(--green);white-space:nowrap}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1rem}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1.4rem;cursor:pointer;transition:all .2s;position:relative;overflow:hidden}
.card:hover{border-color:var(--blue);transform:translateY(-2px);box-shadow:0 8px 24px rgba(88,166,255,.12)}
.card.done{border-color:var(--green)}
.card.done::after{content:'✓';position:absolute;top:.9rem;right:.9rem;color:var(--green);font-size:1.1rem;font-weight:700}
.badge{display:inline-block;padding:.2rem .55rem;border-radius:20px;font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.4px;margin-bottom:.7rem}
.b-red{background:var(--red-dim);color:var(--red)}
.b-amber{background:var(--amber-dim);color:var(--amber)}
.b-blue{background:var(--blue-dim);color:var(--blue)}
.card-num{font-size:.75rem;color:var(--muted);margin-bottom:.2rem}
.card h3{font-size:1rem;margin-bottom:.4rem}
.card p{font-size:.83rem;color:var(--muted);line-height:1.5}

/* ── SIM SCREEN ── */
#sim{display:none;max-width:1100px;margin:0 auto;padding:1.5rem 1.25rem}
.sim-hdr{display:flex;align-items:center;gap:1rem;margin-bottom:1.4rem;flex-wrap:wrap}
.back-btn{background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:.45rem .9rem;border-radius:7px;cursor:pointer;font-size:.88rem;transition:background .15s}
.back-btn:hover{background:var(--border)}
.sim-title{font-size:1.25rem;font-weight:600}
.sim-badge{padding:.2rem .55rem;border-radius:20px;font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.4px}

.sim-body{display:grid;grid-template-columns:1fr 320px;gap:1.25rem;align-items:start}

.circuit-wrap{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1.25rem;min-height:380px;position:relative}
.circuit-wrap svg{display:block;width:100%;height:auto}

.ctrl-col{display:flex;flex-direction:column;gap:.9rem}
.box{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1.1rem}
.box-lbl{font-size:.75rem;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:.65rem;font-weight:600}
.box p{font-size:.88rem;line-height:1.6}

.steps{list-style:none;display:flex;flex-direction:column;gap:.35rem}
.steps li{display:flex;align-items:flex-start;gap:.55rem;font-size:.85rem;color:var(--muted)}
.steps li.active{color:var(--text)}
.steps li.done{color:var(--green)}
.dot{width:20px;height:20px;border-radius:50%;background:var(--surface2);border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:.62rem;flex-shrink:0;margin-top:1px}
.steps li.active .dot{border-color:var(--blue);background:var(--blue-dim);color:var(--blue)}
.steps li.done .dot{border-color:var(--green);background:var(--green-dim);color:var(--green)}

.opt-list{display:flex;flex-direction:column;gap:.45rem}
.opt{background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:.65rem .9rem;border-radius:8px;cursor:pointer;font-size:.875rem;text-align:left;transition:all .15s;display:flex;align-items:center;gap:.55rem}
.opt:hover:not(:disabled){border-color:var(--blue);background:var(--blue-dim)}
.opt.correct{border-color:var(--green)!important;background:var(--green-dim)!important;color:var(--green)!important}
.opt.wrong{border-color:var(--red)!important;background:var(--red-dim)!important;color:var(--red)!important;animation:shake .4s}
.opt:disabled{opacity:.45;cursor:default}
.opt-key{width:22px;height:22px;border-radius:5px;background:var(--surface);border:1px solid var(--border);display:inline-flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:700;flex-shrink:0;color:var(--muted);transition:all .15s}
.opt:hover:not(:disabled) .opt-key{border-color:var(--blue);color:var(--blue)}
.opt.correct .opt-key{border-color:var(--green);color:var(--green);background:var(--green-dim)}
.opt.wrong .opt-key{border-color:var(--red);color:var(--red);background:var(--red-dim)}
.dial-zone{cursor:pointer}
.dial-zone circle{transition:fill .2s,stroke .2s}
.dial-zone:hover circle{filter:brightness(1.4)}
.dial-hint{font-size:.83rem;color:var(--muted);line-height:1.6;padding:.3rem 0}
.conn-msg{font-size:.85rem;line-height:1.55;color:var(--text)}
.conn-counter{font-size:1.2rem;font-weight:700;color:var(--amber);display:block;margin:.3rem 0}
.stage-ctx{font-size:.82rem;color:var(--muted);line-height:1.6;border-left:2px solid var(--border);padding:.35rem 0 .35rem .7rem;margin-bottom:.65rem;background:transparent}
.stage-q{font-size:.9rem;color:var(--text);font-weight:600;line-height:1.5;margin-bottom:.65rem;padding-bottom:.55rem;border-bottom:1px solid var(--border)}

.fb{border-radius:9px;padding:.85rem 1rem;font-size:.85rem;line-height:1.55;display:none;margin-top:.1rem}
.fb.show{display:block}
.fb.err{background:var(--red-dim);border:1px solid #5a1a18;color:#ffb3b0}
.fb.ok{background:var(--green-dim);border:1px solid #1c5c2e;color:#a8f0b8}
.fb.warn{background:var(--amber-dim);border:1px solid #5a3a00;color:#ffd980}
.fb strong{display:block;margin-bottom:.3rem}

.next-btn{background:linear-gradient(135deg,var(--blue),var(--green));border:none;color:#fff;padding:.7rem 1.2rem;border-radius:8px;cursor:pointer;font-size:.9rem;font-weight:600;width:100%;display:none;transition:opacity .15s;margin-top:.1rem}
.next-btn:hover{opacity:.88}
.next-btn.show{display:block}

/* ── Slider ── */
.slider-wrap{display:flex;flex-direction:column;gap:.4rem}
.slider-wrap label{font-size:.83rem;color:var(--muted)}
.slider-wrap input[type=range]{width:100%;accent-color:var(--blue);cursor:pointer}
.meter-row{display:flex;align-items:center;justify-content:space-between;background:var(--surface2);border:1px solid var(--border);border-radius:7px;padding:.6rem .85rem;font-family:'Courier New',monospace}
.meter-val{font-size:1.3rem;font-weight:700;color:var(--green)}
.meter-val.danger{color:var(--red);animation:flash .4s infinite}
.meter-unit{font-size:.82rem;color:var(--muted)}
.safe-bar{height:6px;background:var(--surface2);border-radius:3px;overflow:hidden;margin-top:.3rem}
.safe-fill{height:100%;background:var(--green);border-radius:3px;transition:width .2s,background .2s}
.safe-fill.over{background:var(--red)}

/* ── Connector dots (S4) ── */
.conn{cursor:pointer}
.conn circle{transition:fill .2s,stroke .2s}
.conn:hover circle{stroke:var(--blue)!important;stroke-width:3!important}
.conn.loose circle{fill:var(--amber)!important;stroke:var(--amber)!important}
.conn.loose{animation:flicker .6s ease infinite}
.conn.fixed circle{fill:var(--green)!important;stroke:var(--green)!important}
.conn.inspected circle{fill:var(--muted)!important;stroke:var(--muted)!important}

/* ── SVG elements ── */
.w{stroke:var(--wire);stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
.w-live{stroke:var(--wire-live);stroke-width:2.5;fill:none}
.w-fault{stroke:var(--red);stroke-width:3.5;fill:none;stroke-dasharray:6 3}
.comp{stroke:var(--muted);stroke-width:2;fill:var(--surface)}
.comp-fill{fill:#1a2233;stroke:var(--muted);stroke-width:2}
.lbl{fill:var(--muted);font-family:'Segoe UI',sans-serif;font-size:11px;text-anchor:middle}
.lbl-val{fill:var(--blue);font-family:'Courier New',monospace;font-size:12px;text-anchor:middle}
.phase-R{stroke:#cc3333}
.phase-S{stroke:#3366cc}
.phase-T{stroke:#cc9900}
.meter-circle{stroke:var(--blue);stroke-width:2;fill:#0c1e40}
.meter-text{fill:var(--blue);font-family:'Segoe UI',sans-serif;font-size:13px;text-anchor:middle;font-weight:600}
.node{fill:var(--wire);stroke:none}
.spark{fill:var(--amber);opacity:0}
.spark.on{animation:spark-anim .5s ease forwards}

/* ── Animations ── */
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
@keyframes flash{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes flicker{0%,100%{opacity:1}20%{opacity:.2}60%{opacity:.8}80%{opacity:.1}}
@keyframes spark-anim{0%{opacity:1;transform:scale(1)}60%{opacity:.7;transform:scale(2)}100%{opacity:0;transform:scale(3)}}
@keyframes danger-flash{0%,100%{background:var(--surface)}50%{background:#1a0505}}
.danger-bg{animation:danger-flash .35s ease 4}

/* ── COMPLETION ── */
#completion{display:none;max-width:600px;margin:3rem auto;padding:1.25rem;text-align:center}
.comp-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:2.5rem}
.comp-score{font-size:4rem;font-weight:700;background:linear-gradient(135deg,var(--blue),var(--green));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1}
.comp-card h2{margin:1rem 0 .5rem;font-size:1.4rem}
.comp-card p{color:var(--muted);font-size:.9rem;line-height:1.6}
.restart-btn{background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:.7rem 1.5rem;border-radius:8px;cursor:pointer;font-size:.9rem;margin-top:1.5rem;transition:background .15s}
.restart-btn:hover{background:var(--border)}

/* ── Responsive ── */
@media(max-width:680px){
  .sim-body{grid-template-columns:1fr}
  .hdr h1{font-size:1.5rem}
}
</style>
</head>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<body>

<!-- ═══════════════ LANDING ═══════════════ -->
<div id="landing">
  <div class="hdr">
    <h1>SimLab · Laboratorio Eléctrico</h1>
    <p>Simulador de errores y buenas prácticas · Convertidores Eléctricos 41151</p>
    <small>Identifica el error, corrige el procedimiento, aprende la norma.</small>
    <div id="student-bar" style="display:none;margin-top:.85rem;display:none;align-items:center;justify-content:center;gap:1rem;flex-wrap:wrap">
      <span style="font-size:.83rem;color:var(--muted)">Sesión: <strong id="student-display-name" style="color:var(--text)">Estudiante</strong></span>
      <button onclick="sbLogout()" style="background:none;border:1px solid var(--border);color:var(--muted);padding:.25rem .65rem;border-radius:6px;cursor:pointer;font-size:.78rem;font-family:inherit;transition:border-color .15s,color .15s" onmouseover="this.style.borderColor='var(--red)';this.style.color='var(--red)'" onmouseout="this.style.borderColor='var(--border)';this.style.color='var(--muted)'">Salir</button>
    </div>
  </div>

  <div class="progress-row">
    <span>Progreso</span>
    <div class="pbar"><div class="pfill" id="pfill" style="width:0%"></div></div>
    <span class="pscore" id="pscore">0 / 5 escenarios</span>
  </div>

  <div class="grid" id="card-grid"></div>
</div>

<!-- ═══════════════ SIM SCREEN ═══════════════ -->
<div id="sim">
  <div class="sim-hdr">
    <button class="back-btn" onclick="tryGoBack()">← Volver</button>
    <div class="sim-title" id="sim-title"></div>
    <div class="sim-badge badge" id="sim-badge"></div>
  </div>
  <div class="sim-body">
    <div class="circuit-wrap" id="circuit-wrap"></div>
    <div class="ctrl-col">
      <div class="box">
        <div class="box-lbl">Objetivo</div>
        <p id="obj-text"></p>
      </div>
      <div class="box">
        <div class="box-lbl">Pasos</div>
        <ul class="steps" id="steps-list"></ul>
      </div>
      <div class="box" id="action-box">
        <div class="box-lbl" id="q-lbl">Etapa</div>
        <div class="stage-ctx" id="stage-ctx"></div>
        <div class="stage-q" id="stage-q"></div>
        <div class="opt-list" id="opts"></div>
        <div class="fb" id="fb"></div>
        <button class="next-btn" id="next-btn"></button>
      </div>
    </div>
  </div>
</div>

<!-- ═══════════════ COMPLETION ═══════════════ -->
<div id="completion">
  <div class="comp-card">
    <div class="comp-score" id="comp-score"></div>
    <h2 id="comp-title"></h2>
    <p id="comp-msg"></p>
    <button class="restart-btn" onclick="showLanding()">← Volver al inicio</button>
  </div>
</div>

<script>
// ═══════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════
const state = {
  completed: new Set(),
  wrongAttempts: {},   // scenarioId → count
  currentId: null,
  currentStage: 0,
  stageWrong: 0,       // wrong attempts in current stage
  userId: null,
};

// ═══════════════════════════════════════════
//  SVG HELPERS
// ═══════════════════════════════════════════
const NS = 'http://www.w3.org/2000/svg';
function el(tag, attrs, text) {
  const e = document.createElementNS(NS, tag);
  if (attrs) Object.entries(attrs).forEach(([k,v]) => e.setAttribute(k, v));
  if (text !== undefined) e.textContent = text;
  return e;
}
function makeSVG(w=500, h=300) {
  return el('svg', {viewBox:`0 0 ${w} ${h}`, xmlns:NS});
}
function wire(svg, x1,y1,x2,y2,cls='w') {
  svg.appendChild(el('line', {x1,y1,x2,y2,class:cls}));
}
function label(svg, x, y, txt, cls='lbl') {
  svg.appendChild(el('text', {x, y, class:cls}, txt));
}
function node(svg, x, y) {
  svg.appendChild(el('circle', {cx:x, cy:y, r:4, class:'node'}));
}
function drawResistor(svg, x, y, id, lbl, val) {
  // IEC box
  const g = el('g', id ? {id} : {});
  g.appendChild(el('rect', {x:x-28,y:y-12,width:56,height:24, class:'comp-fill',rx:3}));
  if (lbl) {
    const t = el('text', {x, y:y+35, class:'lbl'}, lbl);
    g.appendChild(t);
  }
  if (val) {
    const t = el('text', {x, y:y+47, class:'lbl-val'}, val);
    g.appendChild(t);
  }
  svg.appendChild(g);
}
function drawInductor(svg, x, y, id) {
  // series of arcs
  const g = el('g', id ? {id} : {});
  let d = `M ${x-30},${y}`;
  for (let i = 0; i < 4; i++) {
    const cx = x - 22 + i * 15;
    d += ` A 7,7 0 0 1 ${cx + 15},${y}`;
  }
  g.appendChild(el('path', {d, class:'w', 'stroke-width':'2.5', fill:'none'}));
  if (id) svg.appendChild(g); else svg.appendChild(g);
  svg.appendChild(g);
}
function drawCapacitor(svg, x, y) {
  wire(svg, x, y-25, x, y-8);
  wire(svg, x, y+8, x, y+25);
  svg.appendChild(el('line', {x1:x-18,y1:y-8,x2:x+18,y2:y-8,class:'comp','stroke-width':'4'}));
  svg.appendChild(el('line', {x1:x-18,y1:y+8,x2:x+18,y2:y+8,class:'comp','stroke-width':'4'}));
}
function drawBattery(svg, x, y, vLabel) {
  // Vertical battery
  wire(svg, x, y-40, x, y-12);
  wire(svg, x, y+12, x, y+40);
  // long line = +
  svg.appendChild(el('line', {x1:x-20,y1:y-12,x2:x+20,y2:y-12,class:'comp','stroke-width':'3.5'}));
  // short line = -
  svg.appendChild(el('line', {x1:x-12,y1:y+12,x2:x+12,y2:y+12,class:'comp','stroke-width':'2'}));
  label(svg, x+28, y-8, '+', 'lbl');
  label(svg, x+28, y+16, '−', 'lbl');
  if (vLabel) label(svg, x, y+58, vLabel, 'lbl-val');
}
function drawMeter(svg, x, y, letter, id) {
  const g = el('g', id ? {id} : {});
  g.appendChild(el('circle', {cx:x,cy:y,r:20, class:'meter-circle'}));
  g.appendChild(el('text', {x,y:y+5, class:'meter-text'}, letter));
  svg.appendChild(g);
  return g;
}
function drawSwitch(svg, x, y, closed=false) {
  svg.appendChild(el('circle', {cx:x-12,cy:y,r:4,class:'comp-fill','stroke-width':'2'}));
  svg.appendChild(el('circle', {cx:x+12,cy:y,r:4,class:'comp-fill','stroke-width':'2'}));
  if (closed) {
    wire(svg, x-8, y, x+8, y);
  } else {
    svg.appendChild(el('line', {x1:x-8,y1:y,x2:x+10,y2:y-14, class:'comp','stroke-width':'2'}));
  }
}
function drawGround(svg, x, y) {
  wire(svg, x, y, x, y+15);
  svg.appendChild(el('line', {x1:x-16,y1:y+15,x2:x+16,y2:y+15,class:'comp','stroke-width':'2'}));
  svg.appendChild(el('line', {x1:x-10,y1:y+21,x2:x+10,y2:y+21,class:'comp','stroke-width':'2'}));
  svg.appendChild(el('line', {x1:x-4,y1:y+27,x2:x+4,y2:y+27,class:'comp','stroke-width':'2'}));
}

// ═══════════════════════════════════════════
//  SCENARIO DEFINITIONS
// ═══════════════════════════════════════════

const SCENARIOS = {

// ─────────────────────────────────────────
//  S1 · Amperímetro en Paralelo
// ─────────────────────────────────────────
1: {
  title: 'Amperímetro en Paralelo',
  badge: 'Alto riesgo', badgeClass: 'b-red',
  objective: 'Mide la corriente total del circuito RL de 12 V / 10 Ω. Elige dónde y cómo conectar el amperímetro del multímetro.',
  steps: ['Identificar los terminales del circuito', 'Elegir la conexión correcta del amperímetro', 'Verificar la lectura'],

  buildCircuit(wrap) {
    wrap.innerHTML = '';
    const svg = makeSVG(500, 310);

    // Main loop wires
    wire(svg, 80, 60, 420, 60);   // top
    wire(svg, 80, 60, 80, 260);   // left
    wire(svg, 420, 60, 420, 260); // right
    wire(svg, 80, 260, 420, 260); // bottom

    // Battery on left side (vertical)
    wire(svg, 80, 100, 80, 140);
    svg.appendChild(el('line', {x1:60,y1:140,x2:100,y2:140,class:'comp','stroke-width':'4'}));
    svg.appendChild(el('line', {x1:65,y1:160,x2:95,y2:160,class:'comp','stroke-width':'2.5'}));
    wire(svg, 80, 160, 80, 200);
    label(svg, 50, 150, '+');
    label(svg, 50, 165, '−');
    label(svg, 80, 225, '12 V DC', 'lbl-val');

    // Resistor on top
    svg.appendChild(el('rect', {x:162,y:48,width:56,height:24,class:'comp-fill',rx:3}));
    label(svg, 190, 40, 'R = 10 Ω', 'lbl');

    // Inductor on top
    let d = `M ${290},${60}`;
    for (let i = 0; i < 4; i++) d += ` A 8,8 0 0 1 ${290 + (i+1)*16},60`;
    svg.appendChild(el('path', {d, class:'w', fill:'none'}));
    label(svg, 330, 40, 'L = 50 mH', 'lbl');

    // Nodes
    node(svg, 80, 60);
    node(svg, 420, 60);

    // ── Wrong option ghost: ammeter in PARALLEL (across R) ──
    const gWrong = el('g', {id:'g-wrong', opacity:'0'});
    gWrong.appendChild(el('line', {x1:162,y1:90,x2:162,y2:130,class:'w-fault'}));
    gWrong.appendChild(el('line', {x1:218,y1:90,x2:218,y2:130,class:'w-fault'}));
    gWrong.appendChild(el('line', {x1:162,y1:130,x2:218,y2:130,class:'w-fault'}));
    gWrong.appendChild(el('circle', {cx:190,cy:130,r:22,class:'meter-circle',stroke:'var(--red)'}));
    gWrong.appendChild(el('text', {x:190,y:135, class:'meter-text',fill:'var(--red)'}, 'A'));

// ═══════════════════════════════════════════
//  NAVIGATION
// ═══════════════════════════════════════════
function showLanding() {
  document.getElementById('landing').style.display = 'block';
  document.getElementById('sim').style.display = 'none';
  document.getElementById('completion').style.display = 'none';
  state.currentId = null;
  renderCards();
}

function tryGoBack() {
  if (state.currentId && !state.completed.has(state.currentId)) {
    const ok = confirm('Si sales ahora perderás el progreso del escenario actual y tendrás que repetirlo. ¿Deseas salir de todas formas?');
    if (!ok) return;
  }
  showLanding();
}

window.addEventListener('beforeunload', function(e) {
  const simEl = document.getElementById('sim');
  if (simEl && simEl.style.display === 'block' && state.currentId && !state.completed.has(state.currentId)) {
    e.preventDefault();
    e.returnValue = '';
  }
});

function renderCards() {
  const grid = document.getElementById('card-grid');
  grid.innerHTML = '';
  const badges = ['b-red','b-red','b-red','b-amber','b-blue'];
  CARD_META.forEach((m, i) => {
    const sc = SCENARIOS[m.id];
    const done = state.completed.has(m.id);
    const card = document.createElement('div');
    card.className = 'card' + (done ? ' done' : '');
    card.innerHTML = `
      <span class="badge ${sc.badgeClass}">${sc.badge}</span>
      <div class="card-num">Escenario ${m.id} de 5</div>
      <h3>${sc.title}</h3>
      <p>${m.desc}</p>
    `;
    card.onclick = () => startScenario(m.id);
    grid.appendChild(card);
  });
  const n = state.completed.size;
  document.getElementById('pfill').style.width = (n/5*100)+'%';
  document.getElementById('pscore').textContent = n + ' / 5 escenarios';
}

function startScenario(id) {
  state.currentId = id;
  state.currentStage = 0;
  state.stageWrong = 0;

  const sc = SCENARIOS[id];
  document.getElementById('landing').style.display = 'none';
  document.getElementById('sim').style.display = 'block';
  document.getElementById('completion').style.display = 'none';

  document.getElementById('sim-title').textContent = sc.title;
  const badgeEl = document.getElementById('sim-badge');
  badgeEl.textContent = sc.badge;
  badgeEl.className = 'sim-badge badge ' + sc.badgeClass;
  document.getElementById('obj-text').textContent = sc.objective;

  // Build steps list
  const stepsList = document.getElementById('steps-list');
  stepsList.innerHTML = '';
  sc.steps.forEach((s, i) => {
    const li = document.createElement('li');
    li.id = `step-${i}`;
    li.innerHTML = `<span class="dot">${i+1}</span><span>${s}</span>`;
    stepsList.appendChild(li);
  });

  sc.buildCircuit(document.getElementById('circuit-wrap'));
  renderStage(id, 0);
}

function renderStage(id, stageIdx) {
  const sc = SCENARIOS[id];
  const stage = sc.stages[stageIdx];
  state.currentStage = stageIdx;
  state.stageWrong = 0;

  // Update steps
  sc.stages.forEach((_, i) => {
    const li = document.getElementById(`step-${i}`);
    if (!li) return;
    li.className = i < stageIdx ? 'done' : i === stageIdx ? 'active' : '';
  });

  document.getElementById('q-lbl').textContent = `Etapa ${stageIdx + 1} de ${sc.stages.length} · ${stage.label}`;
  document.getElementById('stage-ctx').textContent = stage.context || '';
  document.getElementById('stage-q').textContent = stage.question || '';
  document.getElementById('fb').className = 'fb';
  document.getElementById('fb').innerHTML = '';
  document.getElementById('next-btn').className = 'next-btn';

  const opts = document.getElementById('opts');
  opts.innerHTML = '';

  // ── S2 Stage 0: dial del multímetro clickeable en SVG ──
  if (id === 2 && stageIdx === 0) {
    const hint = document.createElement('p');
    hint.className = 'dial-hint';
    hint.innerHTML = 'Haz clic directamente en el <strong style="color:var(--text)">selector del multímetro</strong> para elegir la función correcta.';
    opts.appendChild(hint);
    setupDialClicks(id, stageIdx);
    return;
  }

  // ── S4 Stage 0: conectores interactivos en SVG ──
  if (stage.isConnectorStage) {
    sc._fixedIds = new Set();
    const msg = document.createElement('div');
    msg.className = 'conn-msg';
    msg.innerHTML = `Haz clic en los conectores <span style="color:var(--amber);font-weight:600">ámbar parpadeantes</span> del circuito para apretarlos.<br><span class="conn-counter" id="conn-count">3 conectores flojos</span>`;
    opts.appendChild(msg);

    document.querySelectorAll('.conn.loose').forEach(g => {
      g.onclick = () => {
        if (g.classList.contains('fixed')) return;
        g.className = 'conn fixed';
        const circ = g.querySelector('circle');
        circ.setAttribute('fill','var(--green)');
        circ.setAttribute('stroke','var(--green)');
        sc._fixedIds.add(g.id);
        updateConnectorStatus(id, stageIdx);
      };
    });
    updateConnectorStatus(id, stageIdx);
    return;
  }

  // ── Slider stage (S5 step 1) ──
  if (stage.isSliderStage) {
    const sliderBox = document.createElement('div');
    sliderBox.className = 'slider-wrap';
    sliderBox.innerHTML = `
      <label>Ajusta el reóstato: R_var = <span id="sl-val">6.0</span> Ω</label>
      <input type="range" id="rheo-slider" min="0" max="20" step="0.5" value="6">
      <div class="meter-row">
        <span>Corriente calculada</span>
        <span class="meter-val" id="sl-current">2.00 A</span>
        <span class="meter-unit">I = 24/(R_var + 6)</span>
      </div>
      <div class="safe-bar"><div class="safe-fill" id="safe-fill" style="width:57%"></div></div>
      <div style="display:flex;justify-content:space-between;margin-top:.2rem">
        <span style="font-size:.75rem;color:var(--muted)">0 A</span>
        <span style="font-size:.75rem;color:var(--amber)">3.5 A max</span>
        <span style="font-size:.75rem;color:var(--muted)">4 A</span>
      </div>
    `;
    opts.appendChild(sliderBox);
    const slider = sliderBox.querySelector('#rheo-slider');
    slider.addEventListener('input', () => {
      const v = slider.value;
      document.getElementById('sl-val').textContent = parseFloat(v).toFixed(1);
      const I = 24 / (parseFloat(v) + 6);
      const cur = document.getElementById('sl-current');
      cur.textContent = I.toFixed(2) + ' A';
      cur.className = 'meter-val' + (I > 3.5 ? ' danger' : '');
      const pct = Math.min(100, (I/4)*100);
      const sf = document.getElementById('safe-fill');
      sf.style.width = pct + '%';
      sf.className = 'safe-fill' + (I > 3.5 ? ' over' : '');
      sc.updateSlider(v);
    });
    sc.updateSlider('6');
  }

  // ── Opciones con letras neutras A / B / C ──
  stage.options.forEach((opt, oi) => {
    const btn = document.createElement('button');
    btn.className = 'opt';
    const letter = String.fromCharCode(65 + oi);
    btn.innerHTML = `<span class="opt-key">${letter}</span><span>${opt.label}</span>`;
    btn.onclick = () => handleOption(id, stageIdx, oi, btn);
    opts.appendChild(btn);
  });
}

function updateConnectorStatus(id, stageIdx) {
  const sc = SCENARIOS[id];
  const remaining = sc._looseIds.size - sc._fixedIds.size;
  const counter = document.getElementById('conn-count');
  const fb = document.getElementById('fb');
  if (counter) {
    counter.textContent = remaining > 0
      ? `${remaining} conector${remaining > 1 ? 'es' : ''} flojo${remaining > 1 ? 's' : ''}`
      : '✓ Todos los conectores firmes';
    counter.style.color = remaining > 0 ? 'var(--amber)' : 'var(--green)';
  }
  if (remaining === 0) {
    fb.innerHTML = '<strong>¡Todos los conectores apretados!</strong> El circuito está listo. Procede a energizar.';
    fb.className = 'fb ok show';
    // Auto-show proceed button (correct option is index 1)
    const nextBtn = document.getElementById('next-btn');
    nextBtn.textContent = 'Energizar circuito →';
    nextBtn.className = 'next-btn show';
    nextBtn.onclick = () => {
      const stage = sc.stages[stageIdx];
      const correctOpt = stage.options.find(o => o.correct);
      if (correctOpt) {
        fb.innerHTML = correctOpt.fb;
        fb.className = 'fb ok show';
        if (correctOpt.effect) correctOpt.effect();
      }
      const li = document.getElementById(`step-${stageIdx}`);
      if (li) li.className = 'done';
      nextBtn.textContent = 'Siguiente etapa →';
      nextBtn.onclick = () => {
        document.getElementById('circuit-wrap').classList.remove('danger-bg');
        renderStage(id, stageIdx + 1);
      };
    };
  }
}

// ── SVG Dial interaction (Scenario 2 Stage 0) ──
function setupDialClicks(id, stageIdx) {
  // Map SVG dial IDs → option indices in stage.options
  const dialToOpt = { 'd-vdc': 0, 'd-adc': 1, 'd-ohm': 2 };
  const dialExtra = {
    'd-vac': '<strong>V AC (≈) es para corriente alterna.</strong> Esta fuente es 15 V DC. Necesitas la posición <strong>V DC (⎓)</strong>.',
    'd-off': '<strong>OFF apaga el instrumento.</strong> Selecciona una función de medición activa.'
  };
  document.querySelectorAll('.dial-zone').forEach(g => {
    g.style.cursor = 'pointer';
    g.onclick = () => {
      const dialId = g.id;
      if (dialToOpt[dialId] !== undefined) {
        handleDialClick(id, stageIdx, dialToOpt[dialId], g);
      } else if (dialExtra[dialId]) {
        const fb = document.getElementById('fb');
        fb.innerHTML = dialExtra[dialId];
        fb.className = 'fb warn show';
        const circ = g.querySelector('circle');
        const prev = circ.getAttribute('fill') || '#1a2a3a';
        circ.setAttribute('fill', '#2a1f00');
        circ.setAttribute('stroke', 'var(--amber)');
        if (!state.wrongAttempts[id]) state.wrongAttempts[id] = 0;
        state.wrongAttempts[id]++;
        setTimeout(() => {
          circ.setAttribute('fill', prev);
          circ.removeAttribute('stroke');
        }, 1000);
      }
    };
  });
}

function handleDialClick(id, stageIdx, optIdx, dialEl) {
  const sc = SCENARIOS[id];
  const stage = sc.stages[stageIdx];
  const opt = stage.options[optIdx];
  // Disable all dials while feedback is shown
  document.querySelectorAll('.dial-zone').forEach(g => { g.onclick = null; g.style.cursor = 'default'; });
  const circ = dialEl.querySelector('circle');
  const fb = document.getElementById('fb');
  if (opt.correct) {
    circ.setAttribute('fill', 'var(--green-dim)');
    circ.setAttribute('stroke', 'var(--green)');
    fb.innerHTML = opt.fb;
    fb.className = 'fb ok show';
    if (opt.effect) opt.effect();
    const li = document.getElementById(`step-${stageIdx}`);
    if (li) li.className = 'done';
    const nextBtn = document.getElementById('next-btn');
    const isLast = stageIdx >= sc.stages.length - 1;
    nextBtn.className = 'next-btn show';
    if (isLast) {
      nextBtn.textContent = '✓ Completar escenario';
      nextBtn.onclick = () => completeScenario(id);
    } else {
      nextBtn.textContent = 'Siguiente etapa →';
      nextBtn.onclick = () => {
        document.getElementById('circuit-wrap').classList.remove('danger-bg');
        renderStage(id, stageIdx + 1);
      };
    }
  } else {
    circ.setAttribute('fill', 'var(--red-dim)');
    circ.setAttribute('stroke', 'var(--red)');
    fb.innerHTML = opt.fb;
    fb.className = 'fb err show';
    if (opt.effect) opt.effect();
    if (!state.wrongAttempts[id]) state.wrongAttempts[id] = 0;
    state.wrongAttempts[id]++;
    setTimeout(() => {
      circ.setAttribute('fill', '#1a2a3a');
      circ.removeAttribute('stroke');
      document.getElementById('circuit-wrap').classList.remove('danger-bg');
      setupDialClicks(id, stageIdx); // re-register handlers
    }, 1400);
  }
}

function handleOption(id, stageIdx, optIdx, btn) {
  const sc = SCENARIOS[id];
  const stage = sc.stages[stageIdx];
  const opt = stage.options[optIdx];

  // Connector stage special check
  if (opt.checkLoose !== undefined) {
    const remaining = sc._looseIds.size - (sc._fixedIds ? sc._fixedIds.size : 0);
    if (remaining > 0) {
      btn.className = 'opt wrong';
      const fb = document.getElementById('fb');
      fb.innerHTML = `<strong>Quedan ${remaining} conector(es) flojos.</strong> Identifícalos (ámbar parpadeante) y haz clic para apretarlos primero.`;
      fb.className = 'fb err show';
      setTimeout(() => { btn.className = 'opt'; }, 800);
      return;
    }
  }

  // Slider stage: must be in target range
  if (opt.requiresTarget) {
    const I = 24 / (sc._rVar + 6);
    if (I < 1.9 || I > 2.1) {
      btn.className = 'opt wrong';
      const fb = document.getElementById('fb');
      fb.innerHTML = `<strong>La corriente actual es ${I.toFixed(2)} A.</strong> Necesitas ajustar el reóstato para obtener exactamente 2.0 A (±0.1 A) antes de energizar. Pista: R_var = (24/2) − 6 = 6 Ω.`;
      fb.className = 'fb err show';
      setTimeout(() => { btn.className = 'opt'; }, 800);
      return;
    }
  }

  // Connector stage: must have fixed all
  if (opt.requiresFixed) {
    const sc4 = SCENARIOS[id];
    const remaining = sc4._looseIds.size - (sc4._fixedIds ? sc4._fixedIds.size : 0);
    if (remaining > 0) {
      btn.className = 'opt wrong';
      const fb = document.getElementById('fb');
      fb.innerHTML = `<strong>Aún hay ${remaining} conector(es) flojos.</strong> Búscalos en el circuito (ámbar parpadeante).`;
      fb.className = 'fb err show';
      setTimeout(() => { btn.className = 'opt'; }, 800);
      return;
    }
  }

  // Disable all buttons
  document.querySelectorAll('#opts .opt').forEach(b => b.disabled = true);

  const fb = document.getElementById('fb');

  if (opt.correct) {
    btn.className = 'opt correct';
    fb.innerHTML = opt.fb;
    fb.className = 'fb ok show';
    if (opt.effect) opt.effect();
    // Mark step done
    const li = document.getElementById(`step-${stageIdx}`);
    if (li) li.className = 'done';
    // Next stage or complete
    const nextBtn = document.getElementById('next-btn');
    const isLast = stageIdx >= sc.stages.length - 1;
    nextBtn.className = 'next-btn show';
    if (isLast) {
      nextBtn.textContent = '✓ Completar escenario';
      nextBtn.onclick = () => completeScenario(id);
    } else {
      nextBtn.textContent = `Siguiente etapa →`;
      nextBtn.onclick = () => {
        document.getElementById('circuit-wrap').classList.remove('danger-bg');
        renderStage(id, stageIdx + 1);
      };
    }
  } else {
    btn.className = 'opt wrong';
    fb.innerHTML = opt.fb;
    fb.className = 'fb err show';
    if (opt.effect) opt.effect();
    state.stageWrong++;
    if (!state.wrongAttempts[id]) state.wrongAttempts[id] = 0;
    state.wrongAttempts[id]++;
    setTimeout(() => {
      btn.className = 'opt';
      document.querySelectorAll('#opts .opt').forEach(b => b.disabled = false);
    }, 1000);
  }
}

function completeScenario(id) {
  state.completed.add(id);
  saveScenarioProgress(id);   // guarda inmediatamente en Supabase
  const total = state.completed.size;

  if (total >= 5) {
    showCompletion();
  } else {
    showLanding();
  }
}

function showCompletion() {
  document.getElementById('landing').style.display = 'none';
  document.getElementById('sim').style.display = 'none';
  document.getElementById('completion').style.display = 'block';

  const totalWrong = Object.values(state.wrongAttempts).reduce((a,b)=>a+b,0);
  const pct = Math.max(0, 100 - totalWrong * 5);
  saveResultsToSupabase(pct, totalWrong);
  document.getElementById('comp-score').textContent = pct + '%';

  let grade, msg;
  if (pct >= 90) {
    grade = '¡Desempeño excelente!';
    msg = 'Dominaste todos los escenarios con errores mínimos. Estás preparado para trabajar con seguridad en el laboratorio de Convertidores Eléctricos. Recuerda: la norma no es burocracia, es la razón por la que sigues aquí.';
  } else if (pct >= 70) {
    grade = 'Buen desempeño';
    msg = 'Completaste todos los escenarios. Revisa los errores que cometiste: los escenarios de alto riesgo (amperímetro, escala, falso cero) son los que más daños generan en la práctica real.';
  } else {
    grade = 'Necesita refuerzo';
    msg = 'Completaste los escenarios pero con varios errores. Te recomendamos repasar las normas del laboratorio y repetir los escenarios de mayor riesgo antes de la próxima práctica.';
  }
  document.getElementById('comp-title').textContent = grade;
  document.getElementById('comp-msg').textContent = msg;
}

//  SUPABASE AUTH + INIT
// ═══════════════════════════════════════════
const SUPABASE_URL      = 'https://ekbambpkhhlvnmqwmgfy.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_9s_MknUajrx98bXQCWqfkw_Pd-lh_ZX';
const { createClient } = supabase;
const _sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let _sessionId = null;
let _startTime = Date.now();

_sb.auth.getSession().then(async ({ data: { session } }) => {
  if (!session) {
    // Not logged in — redirect to landing with auth modal
    window.location.replace('/?auth=1');
    return;
  }

  // Show student name bar
  const meta     = session.user.user_metadata || {};
  const nombre   = meta.nombre   || '';
  const apellido = meta.apellido || '';
  const fullName = (nombre + ' ' + apellido).trim() || 'Estudiante';
  document.getElementById('student-display-name').textContent = fullName;
  document.getElementById('student-bar').style.display = 'flex';

  // Store user id
  state.userId = session.user.id;

  // Cargar progreso guardado — pre-marcar escenarios completados
  const { data: savedProgress } = await _sb
    .from('student_progress')
    .select('scenario_id, wrong_attempts')
    .eq('profile_id', session.user.id)
    .eq('completed', true);
  (savedProgress || []).forEach(p => {
    state.completed.add(p.scenario_id);
    if (p.wrong_attempts) state.wrongAttempts[p.scenario_id] = p.wrong_attempts;
  });

  // Crear registro de sesión para este acceso (fire-and-forget)
  _sb.from('sessions').insert({
    profile_id:          session.user.id,
    status:              'in_progress',
    scenarios_completed: state.completed.size,
    user_agent:          navigator.userAgent.slice(0, 200)
  }).select('id').single().then(({ data }) => {
    if (data) _sessionId = data.id;
  });

  _startTime = Date.now();
  showLanding();
});

function sbLogout() {
  _sb.auth.signOut().then(() => {
    window.location.href = '/';
  });
}

// Finaliza la sesión cuando el estudiante completa los 5 escenarios
async function saveResultsToSupabase(totalScore, totalWrong) {
  if (!_sessionId) return;
  try {
    await _sb.from('sessions').update({
      status:               'completed',
      total_score:          totalScore,
      scenarios_completed:  state.completed.size,
      total_wrong_attempts: totalWrong,
      completed_at:         new Date().toISOString()
    }).eq('id', _sessionId);
  } catch(e) {
    // Silent fail — no interrumpir la experiencia del estudiante
  }
}

// Guarda el progreso de un escenario individual inmediatamente al completarlo
async function saveScenarioProgress(id) {
  if (!state.userId) return;
  const wrong = state.wrongAttempts[id] || 0;
  const score = Math.max(0, 100 - wrong * 20);

  // 1. Upsert en student_progress — persistencia permanente por estudiante
  try {
    await _sb.from('student_progress').upsert({
      profile_id:     state.userId,
      scenario_id:    parseInt(id),
      scenario_name:  SCENARIOS[id]?.title || `Escenario ${id}`,
      completed:      true,
      wrong_attempts: wrong,
      score:          score,
      completed_at:   new Date().toISOString(),
      updated_at:     new Date().toISOString()
    }, { onConflict: 'profile_id,scenario_id' });
  } catch(e) { /* silent */ }

  // 2. Registrar en scenario_results del historial de sesión
  if (_sessionId) {
    _sb.from('scenario_results').insert({
      session_id:       _sessionId,
      scenario_id:      parseInt(id),
      scenario_name:    SCENARIOS[id]?.title || `Escenario ${id}`,
      completed:        true,
      wrong_attempts:   wrong,
      stages_total:     SCENARIOS[id]?.stages?.length || 3,
      stages_completed: SCENARIOS[id]?.stages?.length || 3,
      time_spent_seconds: 0,
      completed_at:     new Date().toISOString()
    }).then(() => {});

    // 3. Actualizar el contador de escenarios en la sesión activa
    _sb.from('sessions').update({
      scenarios_completed: state.completed.size
    }).eq('id', _sessionId).then(() => {});
  }
}
